<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEFLab Recorder</title>
<style>
  :root { --bg: #f3f2ee; --card: #fff; --ink: #15202e; --ink2: #5b6576; --line: #e1dfd9; --accent: #1f3a5f; --ok: #2e7d4f; --no: #b4402f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1217; --card: #151a21; --ink: #e7eaee; --ink2: #9aa4b2; --line: #262e39; --accent: #8fb0dc; --ok: #74c393; --no: #ec8b7c; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font: 600 1.3rem Georgia, serif; margin: 4px 0 2px; }
  p.sub { color: var(--ink2); margin: 0 0 14px; font-size: 0.88rem; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .item .t { font: 500 1.1rem Georgia, serif; margin-bottom: 10px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  button { font: inherit; font-size: 0.85rem; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--line); border-bottom-width: 3px; background: var(--card); color: var(--ink); cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.on { border-color: var(--no); }
  .st { font-size: 0.8rem; color: var(--ink2); margin-top: 8px; }
  .st.ok { color: var(--ok); }
  .send { width: 100%; padding: 14px; margin-top: 6px; background: var(--accent); color: var(--card); border: none; font-weight: 700; font-size: 1rem; }
  .msg { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--no); margin-bottom: 12px; font-size: 0.88rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Speaking · Listen and Repeat</h1>
  <p class="sub">Listen to each sentence, then record yourself. Your recordings stay on this device — only the recording length is sent to TOEFLab.</p>
  <div id="msg"></div>
  <div id="list"></div>
  <button class="send" id="send" disabled onclick="sendBack()">Send to TOEFLab</button>
</div>
<script>
  var data = { items: [], min: 1 }, recs = [], cur = null, player = null;
  try { data = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1))))); } catch (e) {}
  function esc(s) { return String(s || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]; }); }
  function draw() {
    if (!data.items || !data.items.length) { document.getElementById('msg').innerHTML = '<div class="msg">Open this page from TOEFLab (Daily Quest → Speaking).</div>'; return; }
    document.getElementById('list').innerHTML = data.items.map(function (it, i) {
      var r = recs[i];
      return '<div class="item"><div class="t">' + (i + 1) + '. ' + esc(it.text) + '</div><div class="row">' +
        '<button onclick="play(\'' + esc(it.audio) + '\')">▶ Original</button>' +
        '<button id="rb' + i + '" onclick="rec(' + i + ')">● ' + (r ? 'Again' : 'Record') + '</button>' +
        '<button ' + (r && r.url ? '' : 'disabled') + ' onclick="play(recs[' + i + '].url)">▶ My voice</button></div>' +
        '<div class="st ' + (r && r.sec >= data.min ? 'ok' : '') + '" id="st' + i + '">' + (r ? (r.sec >= data.min ? '✓ Recorded ' + r.sec.toFixed(1) + 's' : 'Too short — record again') : '') + '</div></div>';
    }).join('');
    document.getElementById('send').disabled = !data.items.every(function (_, i) { return recs[i] && recs[i].sec >= data.min; });
  }
  function play(url) { if (player) player.pause(); if (!url) return; player = new Audio(url); player.play().catch(function () { document.getElementById('msg').innerHTML = '<div class="msg">The audio couldn’t play. Check your connection.</div>'; }); }
  function rec(i) {
    if (cur) { var same = cur.i === i; cur.mr.stop(); if (same) return; }
    if (player) player.pause();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var mr = new MediaRecorder(stream), chunks = [];
      cur = { mr: mr, i: i, t0: Date.now() };
      mr.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      mr.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        var sec = (Date.now() - cur.t0) / 1000; cur = null;
        recs[i] = { sec: sec, url: URL.createObjectURL(new Blob(chunks, { type: mr.mimeType || 'audio/webm' })) };
        draw();
      };
      mr.start();
      var b = document.getElementById('rb' + i); b.textContent = '■ Stop'; b.classList.add('on');
      document.getElementById('st' + i).textContent = 'Recording… press Stop when you finish.';
    }).catch(function () {
      document.getElementById('msg').innerHTML = '<div class="msg">Microphone access was blocked. Allow the microphone for this page (lock icon in the address bar) and try again.</div>';
    });
  }
  function sendBack() {
    var secs = data.items.map(function (_, i) { return Math.round(recs[i].sec * 10) / 10; });
    if (window.opener) {
      window.opener.postMessage({ type: 'toeflab-speaking', secs: secs }, '*');
      document.getElementById('msg').innerHTML = '<div class="msg" style="border-color:var(--ok)">Sent! You can close this window and go back to TOEFLab.</div>';
      setTimeout(function () { window.close(); }, 1200);
    } else {
      document.getElementById('msg').innerHTML = '<div class="msg">Lost the connection to TOEFLab. Keep TOEFLab open, close this window and press “Open recorder window” again.</div>';
    }
  }
  draw();
</script>
</body>
</html>
